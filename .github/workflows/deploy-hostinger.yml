name: Deploy Portable Office

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = build a FRESH release of main and switch to it (also when main is unchanged); rollback = re-activate the previous release (release-based server script only)"
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

concurrency:
  group: portable-office-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The page list for the post-deploy check comes from the commit that was just deployed,
      # so a city page that is in the code but not on the site is reported, not assumed.
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The pages this push adds (city slugs in the deployed commit that the previous main did
      # not have). They are checked first and named in the log. Empty for manual runs.
      - name: Find the routes this deploy introduces
        id: routes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          new=""
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            slugs() { grep -oE '^[[:space:]]+slug: "[a-z0-9-]+"' | sed -E 's/.*"([a-z0-9-]+)"/\1/' | sort -u; }
            new=$(comm -13 <(git show "$BEFORE:src/data/cityPages.ts" 2>/dev/null | slugs) \
                           <(slugs < src/data/cityPages.ts) | sed 's#^#/cities-we-serve/#' | paste -sd, -)
          fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Routes introduced by this deploy: ${new:-none}"

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ssh-keyscan occasionally gets no answer from a runner (seen 2026-10-12, run
          # 38240690706); retry instead of failing the whole deploy before it starts.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H 187.126.117.26 >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then break; fi
            [ "$i" -lt 5 ] || { echo "::error::ssh-keyscan failed 5 times"; exit 1; }
            echo "ssh-keyscan attempt $i failed; retrying"; sleep 10
          done
          chmod 600 ~/.ssh/known_hosts

      # A push to main runs exactly the command it always ran (no arguments). Only a manual
      # "rollback" run appends an argument; the sudoers entry on the VPS names the command
      # without an argument list, so arguments are already permitted.
      # The output is kept: the release-based server script ends with DEPLOYED_BUILD_ID=<id>,
      # which the next step requires the live site to serve.
      - name: Deploy production
        shell: bash
        env:
          ACTION: ${{ github.event.inputs.action || 'deploy' }}
        run: |
          args=""
          case "$ACTION" in
            deploy) ;;
            rollback) args=" rollback" ;;
            *) echo "::error::unknown action '$ACTION'"; exit 1 ;;
          esac
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            deploy@187.126.117.26 \
            "sudo -n /usr/local/bin/deploy-portable-office$args" | tee "$RUNNER_TEMP/deploy.log"

      # ── Post-deploy verification ─────────────────────────────────────────────────────────
      # With the release-based server script (deploy/deploy-portable-office.sh) the new release
      # has already passed the same checks on its own port before traffic moved; this repeats
      # them on the public site.
      #   • identity — GET /api/build-info must name EXACTLY the commit the server says it built,
      #     and the serving process must have started after that build. Every page must then
      #     carry that process's build id. This works with the legacy in-place script as well:
      #     next.config.ts reads the commit from the checkout at build time (see
      #     app/api/build-info/route.ts).
      #   • every city page of the deployed commit (new ones first) and every sitemap URL must
      #     answer 200 from that build (no cached 404, no stale page from an older build).
      # Which commit is expected: DEPLOYED_REVISION= (release-based script), or the legacy
      # script's "=== Deployment successful: <sha> ===" / "Target: <sha>" lines; this run's
      # commit only if the server printed none. The server deploys origin/main when the job
      # runs, so it may build a NEWER main than this run's commit. That is accepted only when
      # GitHub confirms it contains this run's commit (the newer run then verifies it as well).
      # Remedy for a red run: Actions → Deploy Portable Office → Run workflow (deploy). The
      # release-based script builds a fresh release on every run, also for an unchanged commit.
      # (The legacy in-place script answered "Already up to date" and rebuilt nothing.)
      # Skipped on a rollback: the previous release may legitimately lack the newest pages.
      - name: Verify the deployed pages
        if: ${{ github.event.inputs.action != 'rollback' }}
        shell: bash
        env:
          NEW_ROUTES: ${{ steps.routes.outputs.new }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://portableofficecabin.com"
          log="$RUNNER_TEMP/deploy.log"
          build_id=$(sed -nE 's/^DEPLOYED_BUILD_ID=([A-Za-z0-9_-]+)$/\1/p' "$log" | tail -1)
          if [ -n "$build_id" ]; then
            echo "The server reported BUILD_ID $build_id — every page must come from it."
          fi
          server_commit=$(sed -nE -e 's/^DEPLOYED_REVISION=([0-9a-f]{40})$/\1/p' \
                                  -e 's/^=== Deployment successful: ([0-9a-f]{40})( .*)? ===$/\1/p' "$log" | tail -1)
          [ -n "$server_commit" ] || server_commit=$(sed -nE 's/^Target: +([0-9a-f]{40})$/\1/p' "$log" | tail -1)
          if [ -z "$server_commit" ]; then
            echo "::warning::The server did not say which commit it built; expecting this run's commit $GITHUB_SHA."
            server_commit=$GITHUB_SHA
          elif [ "$server_commit" != "$GITHUB_SHA" ]; then
            # Does the server's commit contain this run's commit? GitHub's compare API (3 tries), then
            # git itself as a fallback (commit history only, no file contents). Fails closed.
            relation=unknown
            for i in 1 2 3; do
              relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$server_commit" --jq .status 2>/dev/null || echo unknown)
              [ "$relation" != unknown ] && break
              sleep 5
            done
            if [ "$relation" = unknown ] && git fetch --quiet --filter=blob:none --unshallow origin main 2>/dev/null; then
              if git merge-base --is-ancestor "$GITHUB_SHA" "$server_commit" 2>/dev/null; then relation=ahead; else relation="not an ancestor (git)"; fi
            fi
            if [ "$relation" = "ahead" ]; then
              echo "::notice::The server built a newer main ($server_commit), which contains this run's commit $GITHUB_SHA. Verifying that commit."
            else
              echo "::error::The server built $server_commit, which does not contain this run's commit $GITHUB_SHA (compare: $relation)."
              exit 1
            fi
          fi
          echo "Expecting production to serve commit $server_commit."
          # The legacy script reloads PM2 at the very end; give the site up to a minute.
          for i in $(seq 1 12); do
            [ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base/" || echo 000)" = 200 ] && break
            sleep 5
          done
          attempt=1
          until node scripts/deploy/verify-release.mjs --base "$base" --source-dir . --github \
                  --expect-commit "$server_commit" \
                  ${build_id:+--build-id "$build_id"} ${NEW_ROUTES:+--new-routes "$NEW_ROUTES"}; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::The deployed site failed verification. This check only reads the public site; it changed nothing in production (no restart, no rollback). Release-based script: Run workflow → deploy builds a fresh release. Legacy in-place script: a re-run of an unchanged main rebuilds nothing; a stale ISR page heals at its next revalidation or with the next deploy. See deploy/README.md."
              exit 1
            fi
            attempt=$((attempt + 1)); echo "Retrying verification in 20 s (attempt $attempt of 3)"; sleep 20
          done
          # A record of what is live, in the run summary.
          {
            echo "### Live production build"
            echo '```json'
            curl -sS --max-time 20 "$base/api/build-info" || echo '"unavailable"'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
