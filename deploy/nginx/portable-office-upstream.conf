# /etc/nginx/conf.d/portable-office-upstream.conf
# Managed by /usr/local/bin/deploy-portable-office — do not edit by hand.
# The port below is the LIVE slot: 3000 = portable-office, 3010 = portable-office-b.
# The site file /etc/nginx/sites-available/portableofficecabin.com uses
#     proxy_pass http://portable_office;
# so switching releases is a rewrite of this one line plus a graceful `nginx reload`.
upstream portable_office {
    server 127.0.0.1:3000;
}
